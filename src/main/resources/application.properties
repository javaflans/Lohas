spring.application.name=lohas

# Database (set DB_URL / DB_USER / DB_PASSWORD in the environment)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lohas?useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate: keep the legacy (non-Boot) column naming, entities map camelCase columns as-is
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JSP views under /WEB-INF/pages
spring.mvc.view.prefix=/WEB-INF/pages/
spring.mvc.view.suffix=.jsp

# Keep the Jackson 2 JSON format the Kendo front end was written against (dates as timestamps)
spring.jackson.use-jackson2-defaults=true
spring.jackson.datatype.datetime.write-dates-as-timestamps=true

# Outgoing mail (set MAIL_USERNAME / MAIL_PASSWORD in the environment)
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.username=${MAIL_USERNAME:}
mail.password=${MAIL_PASSWORD:}
